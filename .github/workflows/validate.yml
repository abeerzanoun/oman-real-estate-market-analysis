name: Validate project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      IPYTHONDIR: /tmp/oman-ipy
      MPLCONFIGDIR: /tmp/oman-mpl
      XDG_CACHE_HOME: /tmp/oman-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m src.validate_environment
      - run: python -m pip check
      - name: Validate registered row uploads and remaining aggregate uploads offline
        run: python -m src.validate_uploads
      - name: Reproduce scoped EDA and execute notebook
        run: python -m src.run_eda
      - run: python -m pytest
