name: Validate project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cloud-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install uv
      - name: Install only the Cloud runtime with uv and prebuilt wheels
        run: uv pip install --system --no-build -r requirements.txt
      - run: uv pip check --system
      - name: Render all six pages without analysis or notebook dependencies
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          from src.dashboard_pages import PAGES
          app = AppTest.from_file("streamlit_app.py", default_timeout=30).run()
          for page in PAGES:
              app.radio(key="page").set_value(page).run()
              assert not app.exception and not app.error, f"Runtime failure: {page}"
              print(f"PASS Cloud runtime: {page}")
          PY
  python:
    runs-on: ubuntu-latest
    env:
      IPYTHONDIR: /tmp/oman-ipy
      MPLCONFIGDIR: /tmp/oman-mpl
      XDG_CACHE_HOME: /tmp/oman-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m src.validate_environment
      - run: python -m pip check
      - name: Audit duplicates before any analytical/model reproduction
        run: python -m src.audit_duplicates
      - name: Validate registered row uploads and remaining aggregate uploads offline
        run: python -m src.validate_uploads
      - name: Reproduce scoped EDA and execute notebook
        run: python -m src.run_eda
      - run: python -m pytest
